# ElasticMQ configuration — local SQS-compatible queue
# Defines the queues available in local development

include classpath("application.conf")

queues {
  events-queue {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }

  events-queue-dead-letter {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
}

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}
